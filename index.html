<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Air Sample fDAC Calculator</title>
  <meta name="theme-color" content="#004466" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: auto;
      max-width: 700px;
      background: #f9f9f9;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      font-size: 1em;
    }
    .result {
      font-size: 1.2em;
      font-weight: bold;
      margin-top: 10px;
    }
    @media (max-width: 480px) {
      body { padding: 10px; }
      input, select, button { font-size: 1em; padding: 8px; }
    }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js')
        .then(reg => console.log('✅ Service worker registered:', reg))
        .catch(err => console.error('❌ Service worker failed:', err));
    }
  </script>
</head>
<body>
  <h2>Air Sample fDAC Calculator</h2>

  <label for="calculationMode">Calculation Mode</label>
  <select id="calculationMode">
    <option value="beta">Beta/Gamma</option>
    <option value="alpha">Alpha</option>
  </select>

  <label for="timeOn">Time On (HHMM)</label>
  <input type="text" id="timeOn" placeholder="e.g., 1730" />

  <label for="timeOff">Time Off (HHMM)</label>
  <input type="text" id="timeOff" placeholder="e.g., 1130" />

  <label for="flowRate">Flow Rate</label>
  <input type="number" id="flowRate" placeholder="e.g., 30" />

  <label for="flowUnit">Flow Rate Unit</label>
  <select id="flowUnit">
    <option value="LPM">LPM</option>
    <option value="CFM">ft³/min</option>
  </select>

  <label for="grossCPM">Gross Activity (CPM)</label>
  <input type="number" id="grossCPM" placeholder="e.g., 150" />

  <label for="backgroundCPM">Background Activity (CPM)</label>
  <input type="number" id="backgroundCPM" placeholder="e.g., 20" />

  <label for="efficiency">Detector Efficiency (decimal)</label>
  <input type="number" id="efficiency" step="0.01" placeholder="e.g., 0.19" />

  <div id="alphaCheckDiv" style="display: none;">
    <input type="checkbox" id="alphaDivided" />
    <label for="alphaDivided">I have divided gross counts by 10 (10-minute alpha count)</label>
  </div>

  <button onclick="calculateDAC()">Calculate fDAC</button>

  <div class="result" id="resultVolume"></div>
  <div class="result" id="resultNetCPM"></div>
  <div class="result" id="resultDAC"></div>

  <script>
    const DPM_PER_UCI = 2.22e6;

    document.getElementById("calculationMode").addEventListener("change", function () {
      const mode = this.value;
      document.getElementById("alphaCheckDiv").style.display = (mode === "alpha") ? "block" : "none";
    });

    function convertToMinutes(timeStr) {
      const hours = parseInt(timeStr.slice(0, 2), 10);
      const minutes = parseInt(timeStr.slice(2), 10);
      return hours * 60 + minutes;
    }

    function calculateDAC() {
      const mode = document.getElementById("calculationMode").value;
      const timeOn = document.getElementById("timeOn").value;
      const timeOff = document.getElementById("timeOff").value;
      const flowRate = parseFloat(document.getElementById("flowRate").value);
      const flowUnit = document.getElementById("flowUnit").value;
      const gross = parseFloat(document.getElementById("grossCPM").value);
      const background = parseFloat(document.getElementById("backgroundCPM").value);
      const efficiency = parseFloat(document.getElementById("efficiency").value);
      const alphaDivided = document.getElementById("alphaDivided").checked;

      const resultVolume = document.getElementById("resultVolume");
      const resultNetCPM = document.getElementById("resultNetCPM");
      const resultDAC = document.getElementById("resultDAC");

      if (
        isNaN(flowRate) || isNaN(gross) || isNaN(background) || isNaN(efficiency) ||
        !/^\d{4}$/.test(timeOn) || !/^\d{4}$/.test(timeOff)
      ) {
        alert("Please fill in all fields correctly.");
        return;
      }

      const onMinutes = convertToMinutes(timeOn);
      const offMinutes = convertToMinutes(timeOff);
      const duration = (offMinutes < onMinutes) ? (1440 - onMinutes + offMinutes) : (offMinutes - onMinutes);
      const flowML = flowUnit === "LPM" ? flowRate * 1000 : flowRate * 28300;
      const volume = duration * flowML;
      resultVolume.textContent = `Total Volume Collected: ${volume.toExponential(4)} mL`;

      const minVolume = mode === "beta" ? 1.5e5 : 3.0e6;
      if (volume < minVolume) {
        alert(`⚠️ WARNING: Volume (${volume.toExponential(2)} mL) is below procedural minimum for ${mode.toUpperCase()}.\nRefer to procedure for extended count time or re-sampling.`);
      }

      let netCPM = gross - background;
      resultNetCPM.textContent = `Net Activity: ${netCPM.toFixed(2)} CPM`;

      if (mode === "alpha" && !alphaDivided) {
        const proceed = confirm("❗Reminder: Gross counts must be divided by 10 for alpha (10 min count).\nProceed anyway?");
        if (!proceed) return;
      }

      const DACValue = mode === "beta" ? 1e-8 : 3e-12;
      const filterFactor = mode === "alpha" ? 0.7 : 1;
      const dacFraction = netCPM / (volume * filterFactor * DPM_PER_UCI * efficiency * DACValue);
      const formattedDAC = dacFraction.toExponential(2);

      let color = "black";
      if (dacFraction >= 0.3) color = "red";
      else if (dacFraction >= 0.1) color = "goldenrod";

      resultDAC.style.color = color;
      resultDAC.textContent = `${mode === "alpha" ? "Alpha" : "Beta/Gamma"} fDAC: ${formattedDAC}`;
    }
  </script>
</body>
</html>
